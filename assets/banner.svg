<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beaconPulse {
      0% { r: 5; opacity: 1; }
      100% { r: 18; opacity: 0; }
    }

    .pulse-glow-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 220px 90px;
    }
    .pulse-glow-2 {
      animation: pulseGlow 8s ease-in-out infinite reverse;
      transform-origin: 1020px 240px;
    }
    .floating-pill {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .floating-pill-rev {
      animation: floatParticle 7s ease-in-out infinite reverse;
    }
    .animated-route {
      stroke-dasharray: 8 6;
      animation: dashTravel 8s linear infinite;
    }
    .beacon {
      animation: beaconPulse 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />
  <rect width="1200" height="360" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulse-glow-1" cx="220" cy="90" r="160" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />
  <circle class="pulse-glow-2" cx="1020" cy="240" r="180" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="180" r="260" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Dynamic Route Lines (representing technician dispatch / telemetry) -->
  <g opacity="0.45">
    <path class="animated-route" d="M 80,290 C 260,210 320,320 540,270 C 760,220 860,330 1120,250" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="animated-route" d="M 100,70 C 350,150 480,40 750,110 C 950,160 1020,80 1140,110" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Left Dynamic Element: Real-time Dispatch Beacon Node -->
  <g class="floating-pill" transform="translate(85, 120)">
    <rect width="170" height="70" rx="14" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="35" cy="35" r="8" fill="#38bdf8" />
    <circle class="beacon" cx="35" cy="35" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="58" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">DISPATCH ACTIVE</text>
    <text x="58" y="49" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">GPS Route Sync</text>
  </g>

  <!-- Right Dynamic Element: Offline-First Mobile Sync Node -->
  <g class="floating-pill-rev" transform="translate(945, 120)">
    <rect width="170" height="70" rx="14" fill="url(#pillGrad1)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="35" cy="35" r="8" fill="#a855f7" />
    <circle class="beacon" cx="35" cy="35" r="8" fill="none" stroke="#a855f7" stroke-width="2" />
    <text x="58" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MOBILE SYNC</text>
    <text x="58" y="49" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Offline-First DB</text>
  </g>

  <!-- Bottom Floating Feature Pills -->
  <g opacity="0.9" transform="translate(0, 10)">
    <!-- Work Orders Pill -->
    <g transform="translate(280, 275)">
      <rect width="145" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="72.5" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Work Orders</text>
    </g>
    <!-- Field Dispatch Pill -->
    <g transform="translate(445, 275)">
      <rect width="140" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="70" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📍 Live Dispatch</text>
    </g>
    <!-- Scheduling Pill -->
    <g transform="translate(605, 275)">
      <rect width="145" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="72.5" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📅 Dynamic Shift</text>
    </g>
    <!-- Invoicing Pill -->
    <g transform="translate(770, 275)">
      <rect width="150" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="75" y="23" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💳 On-Site Invoicing</text>
    </g>
  </g>

  <!-- FOREGROUND: Central Typography (Guaranteed crisp and in front of dynamic elements) -->
  <!-- Top Tag Badge -->
  <g transform="translate(515, 45)">
    <rect width="170" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="85" y="18" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CURATED LIST</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="135" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">
    Awesome Mobile Field Service
  </text>
  <text x="600" y="185" text-anchor="middle" fill="url(#accentGrad1)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
    Application Platforms
  </text>

  <!-- Subtitle -->
  <text x="600" y="230" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
    Top SaaS Solutions &amp; Self-Hosted Open-Source FSM Software for Mobile Workforces
  </text>
</svg>
